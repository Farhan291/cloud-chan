name: Deploy NixOS

on:
  push:
    branches: [master]
    paths:
      - "infra/nixos/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        env:
          NIX_SSHOPTS: "-o StrictHostKeyChecking=no -i /home/runner/.ssh/id_ed25519"
        run: |
          nix shell nixpkgs#nixos-rebuild --command nixos-rebuild switch \
            --flake ./infra/nixos#azure \
            --target-host root@${{ secrets.VPS_IP }}
